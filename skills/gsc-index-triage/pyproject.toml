[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gsc-triage"
dynamic = ["version"]
description = "Find pages Google hasn't indexed and pick which deserve today's few Search Console \"Request indexing\" clicks."
readme = "PYPI.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mohit Sapat" }]
keywords = ["seo", "google-search-console", "indexing", "indexnow", "sitemap", "technical-seo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = ["google-auth>=2.20", "requests>=2.28", "pillow>=10.1"]

[project.urls]
Homepage = "https://github.com/sapatmohit/agent-skills"
Source = "https://github.com/sapatmohit/agent-skills/tree/main/skills/gsc-index-triage"
Issues = "https://github.com/sapatmohit/agent-skills/issues"

[project.scripts]
gsc-triage = "gsc_triage:main"

[tool.hatch.version]
path = "scripts/gsc_triage.py"

[tool.hatch.build.targets.wheel]
only-include = ["scripts/gsc_triage.py"]
sources = ["scripts"]

[tool.hatch.build.targets.sdist]
only-include = ["scripts/gsc_triage.py", "tests", "PYPI.md", "SKILL.md"]
